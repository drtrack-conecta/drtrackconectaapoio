<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRTRACK Conecta - Gestão Operacional</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --accent: #0284c7;
      --text: #f8fafc; --dim: #94a3b8; --border: #334155;
      --success: #16a34a; --warning: #ca8a04; --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--card); padding: 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.2rem; color: var(--accent); }
    main { flex: 1; padding: 1rem; max-width: 1000px; margin: 0 auto; width: 100%; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1.25rem; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    .form-group { margin-bottom: 0.85rem; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--dim); margin-bottom: 0.25rem; }
    .form-control { width: 100%; padding: 0.6rem; background: var(--bg); border: 1px solid var(--border); border-radius: 0.375rem; color: var(--text); }
    .btn { background: var(--accent); color: white; border: none; padding: 0.6rem 1rem; border-radius: 0.375rem; cursor: pointer; font-weight: 600; width: 100%; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--dim); }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }
    .badge { padding: 0.2rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
    .badge-pendente { background: var(--warning); color: #000; }
    .badge-aceito { background: var(--accent); }
    .badge-concluido { background: var(--success); }
    #map { height: 280px; width: 100%; border-radius: 0.5rem; border: 1px solid var(--border); margin-bottom: 1rem; }
    .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin-top: 0.5rem; }
    .photo-preview { width: 100%; height: 120px; object-fit: cover; border-radius: 0.25rem; border: 1px solid var(--border); }
    .chat-box { height: 180px; overflow-y: auto; border: 1px solid var(--border); padding: 0.5rem; background: var(--bg); border-radius: 0.375rem; margin-bottom: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .chat-msg { max-width: 85%; padding: 0.4rem 0.6rem; border-radius: 0.25rem; font-size: 0.85rem; }
    .chat-msg.sent { align-self: flex-end; background: var(--accent); }
    .chat-msg.received { align-self: flex-start; background: var(--border); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>🛡️ DRTRACK Conecta</h1>
    <nav id="nav-public">
      <button class="btn btn-secondary" onclick="showScreen('screen-login')">Acessar Sistema</button>
    </nav>
    <nav id="nav-user" class="hidden">
      <span id="user-info" style="color: var(--dim); font-size: 0.85rem; margin-right: 0.5rem;"></span>
      <button class="btn btn-danger" style="width: auto; padding: 0.4rem 0.8rem;" onclick="logout()">Sair</button>
    </nav>
  </header>

  <main>
    <!-- TELA: LOGIN ÚNICO -->
    <section id="screen-login" class="card">
      <h2 style="margin-bottom: 1rem;">Acesso à Plataforma</h2>
      <div class="form-group">
        <label>Telefone / WhatsApp (Apoio) ou 'admin'</label>
        <input type="text" id="login-user" class="form-control" placeholder="11999999999 ou admin">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="login-pass" class="form-control" placeholder="****">
      </div>
      <button class="btn" onclick="login()">Entrar no Sistema</button>
      <button class="btn btn-secondary" style="margin-top: 0.5rem;" onclick="showScreen('screen-cadastro')">Novo Cadastro de Apoio</button>
    </section>

    <!-- TELA: CADASTRO DE APOIO -->
    <section id="screen-cadastro" class="card hidden">
      <h2>Cadastro de Prestador Apoio</h2>
      <form onsubmit="cadastrarApoio(event)" style="margin-top: 1rem;">
        <div class="grid">
          <div class="form-group"><label>Nome Completo *</label><input type="text" class="form-control" id="cad-nome" required></div>
          <div class="form-group"><label>Telefone/WhatsApp *</label><input type="tel" class="form-control" id="cad-tel" required></div>
          <div class="form-group"><label>Senha de Acesso *</label><input type="password" class="form-control" id="cad-pass" required></div>
          <div class="form-group"><label>Veículo / Placa *</label><input type="text" class="form-control" id="cad-veiculo" required></div>
          <div class="form-group"><label>Chave PIX *</label><input type="text" class="form-control" id="cad-pix" required></div>
        </div>
        <button type="submit" class="btn" style="margin-top: 0.5rem;">Solicitar Cadastro</button>
        <button type="button" class="btn btn-secondary" style="margin-top: 0.5rem;" onclick="showScreen('screen-login')">Voltar</button>
      </form>
    </section>

    <!-- TELA: PAINEL ADMIN -->
    <section id="screen-admin" class="hidden">
      <div class="card">
        <h3>Lançar Ocorrência</h3>
        <form onsubmit="lancarOcorrencia(event)" style="margin-top: 0.75rem;">
          <div class="grid">
            <div class="form-group">
              <label>Tipo de Evento</label>
              <select class="form-control" id="oc-tipo">
                <option value="Aviso de Alarme">Aviso de Alarme</option>
                <option value="Rastreamento de Veículo">Rastreamento de Veículo</option>
                <option value="Preservação de Local">Preservação de Local</option>
              </select>
            </div>
            <div class="form-group"><label>Valor (R$)</label><input type="number" step="0.01" class="form-control" id="oc-valor" required></div>
            <div class="form-group" style="grid-column: 1 / -1;"><label>Endereço Completo</label><input type="text" class="form-control" id="oc-endereco" required></div>
            <div class="form-group"><label>Latitude</label><input type="text" class="form-control" id="oc-lat" placeholder="-23.5505" required></div>
            <div class="form-group"><label>Longitude</label><input type="text" class="form-control" id="oc-lng" placeholder="-46.6333" required></div>
          </div>
          <button type="submit" class="btn" style="margin-top: 0.5rem;">Publicar Ocorrência</button>
        </form>
      </div>

      <div class="card">
        <h3>Painel Geral de Ocorrências</h3>
        <div id="admin-ocorrencias-list" class="grid" style="margin-top: 1rem;"></div>
      </div>
    </section>

    <!-- TELA: PAINEL APOIO -->
    <section id="screen-apoio" class="hidden">
      <div class="card">
        <h3>Seu Status: <span id="gps-status" style="color: var(--warning);">Iniciando GPS...</span></h3>
      </div>
      <div id="map"></div>
      <h3>Ocorrências Próximas</h3>
      <div id="apoio-ocorrencias-list" class="grid" style="margin-top: 0.75rem;"></div>
    </section>

    <!-- TELA: EXECUÇÃO DA OCORRÊNCIA (APOIO) -->
    <section id="screen-execucao" class="card hidden">
      <button class="btn btn-secondary" style="margin-bottom: 1rem;" onclick="showScreen('screen-apoio')">← Voltar</button>
      <h2 id="exec-titulo">Atendimento</h2>
      <p id="exec-endereco" style="color: var(--accent); margin-bottom: 1rem;"></p>

      <div class="card" style="background: var(--bg);">
        <h4>Chat com a Central</h4>
        <div class="chat-box" id="chat-box"></div>
        <div style="display: flex; gap: 0.5rem;">
          <input type="text" class="form-control" id="chat-input" placeholder="Digite uma mensagem...">
          <button class="btn" style="width: auto;" onclick="enviarMensagem()">Enviar</button>
        </div>
      </div>

      <div class="card" style="background: var(--bg); margin-top: 1rem;">
        <h4>Relatório por Escrito *</h4>
        <textarea id="relatorio-texto" class="form-control" rows="3" placeholder="Descreva o que constatou no local..."></textarea>
      </div>

      <div class="card" style="background: var(--bg); margin-top: 1rem;">
        <h4>Fotos do Local (Mínimo 1)</h4>
        <input type="file" accept="image/*" capture="environment" class="form-control" onchange="adicionarFoto(event)">
        <div class="photo-grid" id="photo-grid"></div>
      </div>

      <button class="btn btn-success" style="margin-top: 1rem; padding: 0.8rem;" onclick="finalizarAtendimento()">Finalizar Atendimento e Enviar WhatsApp</button>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let apoios = JSON.parse(localStorage.getItem('dr_apoios')) || [];
    let ocorrencias = JSON.parse(localStorage.getItem('dr_ocorrencias')) || [];
    let chats = JSON.parse(localStorage.getItem('dr_chats')) || {};
    let currentUser = null;
    let selectedOcId = null;
    let map = null, markersGroup = null, userLat = null, userLng = null;

    function saveData() {
      localStorage.setItem('dr_apoios', JSON.stringify(apoios));
      localStorage.setItem('dr_ocorrencias', JSON.stringify(ocorrencias));
      localStorage.setItem('dr_chats', JSON.stringify(chats));
    }

    function showScreen(id) {
      document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
      if (id === 'screen-apoio') initMap();
    }

    function updateNav() {
      if (currentUser) {
        document.getElementById('nav-public').classList.add('hidden');
        document.getElementById('nav-user').classList.remove('hidden');
        document.getElementById('user-info').innerText = `${currentUser.nome}`;
      } else {
        document.getElementById('nav-public').classList.remove('hidden');
        document.getElementById('nav-user').classList.add('hidden');
      }
    }

    function login() {
      const u = document.getElementById('login-user').value.trim();
      const p = document.getElementById('login-pass').value.trim();

      if (u === 'admin' && p === 'admin123') {
        currentUser = { type: 'admin', nome: 'Central Admin' };
        updateNav();
        renderAdmin();
        showScreen('screen-admin');
        return;
      }

      const apoio = apoios.find(a => a.tel.replace(/\D/g, '') === u.replace(/\D/g, '') && a.pass === p);
      if (apoio) {
        currentUser = { type: 'apoio', ...apoio };
        updateNav();
        initGPS();
        renderApoio();
        showScreen('screen-apoio');
      } else {
        alert('Credenciais inválidas.');
      }
    }

    function logout() {
      currentUser = null;
      updateNav();
      showScreen('screen-login');
    }

    function cadastrarApoio(e) {
      e.preventDefault();
      apoios.push({
        id: Date.now(),
        nome: document.getElementById('cad-nome').value,
        tel: document.getElementById('cad-tel').value,
        pass: document.getElementById('cad-pass').value,
        veiculo: document.getElementById('cad-veiculo').value,
        pix: document.getElementById('cad-pix').value
      });
      saveData();
      alert('Cadastro realizado! Faça login para continuar.');
      showScreen('screen-login');
    }

    function lancarOcorrencia(e) {
      e.preventDefault();
      ocorrencias.push({
        id: Date.now(),
        tipo: document.getElementById('oc-tipo').value,
        valor: parseFloat(document.getElementById('oc-valor').value),
        endereco: document.getElementById('oc-endereco').value,
        lat: parseFloat(document.getElementById('oc-lat').value),
        lng: parseFloat(document.getElementById('oc-lng').value),
        status: 'pendente',
        relatorio: '',
        fotos: []
      });
      saveData();
      e.target.reset();
      renderAdmin();
      alert('Ocorrência lançada!');
    }

    function renderAdmin() {
      const container = document.getElementById('admin-ocorrencias-list');
      container.innerHTML = '';
      ocorrencias.forEach(oc => {
        container.innerHTML += `
          <div class="card" style="background: var(--bg)">
            <div style="display:flex; justify-content:space-between;">
              <strong>${oc.tipo}</strong>
              <span class="badge badge-${oc.status}">${oc.status}</span>
            </div>
            <p style="font-size:0.85rem; color:var(--dim); margin:0.5rem 0;">${oc.endereco}</p>
            <p><strong>R$ ${oc.valor.toFixed(2)}</strong></p>
            ${oc.relatorio ? `<p style="font-size:0.8rem; margin-top:0.5rem; background:var(--card); padding:0.4rem;"><strong>Relatório:</strong> ${oc.relatorio}</p>` : ''}
            <button class="btn btn-danger" style="margin-top:0.5rem;" onclick="excluirOc(${oc.id})">Excluir</button>
          </div>`;
      });
    }

    function excluirOc(id) {
      ocorrencias = ocorrencias.filter(o => o.id !== id);
      saveData();
      renderAdmin();
    }

    function initGPS() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(p => {
          userLat = p.coords.latitude;
          userLng = p.coords.longitude;
          document.getElementById('gps-status').innerText = '🟢 Ativo';
          document.getElementById('gps-status').style.color = 'var(--success)';
        });
      }
    }

    function initMap() {
      if (!map) {
        map = L.map('map').setView([-23.5505, -46.6333], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        markersGroup = L.layerGroup().addTo(map);
      }
    }

    function renderApoio() {
      const container = document.getElementById('apoio-ocorrencias-list');
      container.innerHTML = '';
      if (markersGroup) markersGroup.clearLayers();

      ocorrencias.filter(o => o.status === 'pendente' || o.apoioId === currentUser.id).forEach(oc => {
        if (markersGroup) L.marker([oc.lat, oc.lng]).addTo(markersGroup).bindPopup(oc.tipo);

        let btn = oc.status === 'pendente' 
          ? `<button class="btn btn-success" style="margin-top:0.5rem;" onclick="aceitarOc(${oc.id})">Aceitar Ocorrência</button>`
          : `<button class="btn" style="margin-top:0.5rem;" onclick="abrirExecucao(${oc.id})">Abrir Atendimento</button>`;

        container.innerHTML += `
          <div class="card" style="background: var(--bg)">
            <div style="display:flex; justify-content:space-between;">
              <strong>${oc.tipo}</strong>
              <span class="badge badge-${oc.status}">${oc.status}</span>
            </div>
            <p style="font-size:0.85rem; color:var(--dim); margin:0.5rem 0;">${oc.endereco}</p>
            <p><strong>R$ ${oc.valor.toFixed(2)}</strong></p>
            ${btn}
          </div>`;
      });
    }

    function aceitarOc(id) {
      const oc = ocorrencias.find(o => o.id === id);
      if (oc) {
        oc.status = 'aceito';
        oc.apoioId = currentUser.id;
        saveData();
        abrirExecucao(id);
      }
    }

    function abrirExecucao(id) {
      selectedOcId = id;
      const oc = ocorrencias.find(o => o.id === id);
      document.getElementById('exec-titulo').innerText = oc.tipo;
      document.getElementById('exec-endereco').innerText = oc.endereco;
      document.getElementById('relatorio-texto').value = oc.relatorio || '';
      renderChat();
      renderFotos();
      showScreen('screen-execucao');
    }

    function renderChat() {
      const box = document.getElementById('chat-box');
      box.innerHTML = '';
      (chats[selectedOcId] || []).forEach(m => {
        box.innerHTML += `<div class="chat-msg ${m.sender === currentUser.nome ? 'sent' : 'received'}"><strong>${m.sender}:</strong> ${m.texto}</div>`;
      });
      box.scrollTop = box.scrollHeight;
    }

    function enviarMensagem() {
      const input = document.getElementById('chat-input');
      if (!input.value.trim()) return;
      if (!chats[selectedOcId]) chats[selectedOcId] = [];
      chats[selectedOcId].push({ sender: currentUser.nome, texto: input.value.trim() });
      input.value = '';
      saveData();
      renderChat();
    }

    function adicionarFoto(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const oc = ocorrencias.find(o => o.id === selectedOcId);
        if (!oc.fotos) oc.fotos = [];
        oc.fotos.push(evt.target.result);
        saveData();
        renderFotos();
      };
      reader.readAsDataURL(file);
    }

    function renderFotos() {
      const grid = document.getElementById('photo-grid');
      grid.innerHTML = '';
      const oc = ocorrencias.find(o => o.id === selectedOcId);
      (oc.fotos || []).forEach(f => {
        grid.innerHTML += `<img src="${f}" class="photo-preview">`;
      });
    }

    function finalizarAtendimento() {
      const rel = document.getElementById('relatorio-texto').value.trim();
      if (!rel) return alert('Preencha o relatório por escrito.');

      const oc = ocorrencias.find(o => o.id === selectedOcId);
      oc.status = 'concluido';
      oc.relatorio = rel;
      saveData();

      const msg = `*RELATÓRIO DE FINALIZAÇÃO DE OCORRÊNCIA*\n*Prestador:* ${currentUser.nome}\n*Evento:* ${oc.tipo}\n*Endereço:* ${oc.endereco}\n\n*Relatório:* ${rel}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
      showScreen('screen-apoio');
      renderApoio();
    }
  </script>
</body>
</html>
