<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela do Apoio - Ocorrências</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .campo {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    /* Estilo inicial do botão: Vermelho e Desabilitado */
    #btnEnviar {
      background-color: #dc3545; /* Vermelho */
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
      transition: background-color 0.3s ease;
    }

    #btnEnviar:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #btnEnviar:not(:disabled) {
      cursor: pointer;
    }

    /* Estilo quando o botão for ativado para verde */
    #btnEnviar.btn-verde {
      background-color: #28a745 !important; /* Verde */
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .checkbox-container input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Registro de Ocorrência - Apoio</h2>

  <form id="formOcorrencia">
    <!-- Seletor de Arquivos (Câmera + Galeria) -->
    <div class="campo">
      <label for="inputFotos">Escolher os Arquivos / Tirar Fotos:</label>
      <!-- accept="image/*" permite imagens e ativa a câmera ou galeria em dispositivos móveis -->
      <input type="file" id="inputFotos" name="fotos" accept="image/*" multiple>
    </div>

    <!-- Checkbox de Confirmação -->
    <div class="campo">
      <label class="checkbox-container">
        <input type="checkbox" id="checkFotos">
        <span>Confirmo que enviei 5 fotos ou mais via whatsapp</span>
      </label>
    </div>

    <!-- Botão de Envio (Vermelho por padrão) -->
    <button type="submit" id="btnEnviar" disabled>
      Enviar Ocorrência a Central Adm
    </button>
  </form>

  <script>
    const checkFotos = document.getElementById('checkFotos');
    const btnEnviar = document.getElementById('btnEnviar');
    const formOcorrencia = document.getElementById('formOcorrencia');

    // 1. Controla o estado de liberação do botão a partir do checkbox
    checkFotos.addEventListener('change', function() {
      if (this.checked) {
        btnEnviar.disabled = false;
      } else {
        btnEnviar.disabled = true;
        // Se o usuário desmarcar a caixa, o botão volta a ser vermelho
        btnEnviar.classList.remove('btn-verde');
      }
    });

    // 2. Altera a cor do botão para VERDE após o clique (e faz o envio)
    btnEnviar.addEventListener('click', function(event) {
      // Impede o envio imediato se precisar processar a troca visual primeiro
      if (checkFotos.checked) {
        btnEnviar.classList.add('btn-verde');
      }
    });

    // Processamento do formulário
    formOcorrencia.addEventListener('submit', function(event) {
      event.preventDefault(); // Evita recarregar a página para demonstrar o comportamento
      
      alert("Ocorrência enviada com sucesso à Central Adm!");
      // Aqui você pode adicionar o código para enviar os dados ao backend
    });
  </script>

</body>
</html>
